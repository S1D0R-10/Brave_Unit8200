<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#09100f">
  <title>Brave STT — kolejka transkrypcji</title>
  <style>
    :root{--ink:#e9eadf;--muted:#89938a;--dark:#09100f;--panel:#101917;--line:#26332e;--acid:#b9ff4f;--amber:#ffb547;--red:#ff6b5f;--cyan:#65d8cf;--shadow:0 24px 80px rgba(0,0,0,.35)}
    *{box-sizing:border-box} html{background:var(--dark);color:var(--ink);font-family:"Bahnschrift","Aptos Narrow",sans-serif} body{margin:0;min-height:100vh;background:radial-gradient(circle at 78% -10%,rgba(101,216,207,.11),transparent 38%),linear-gradient(rgba(185,255,79,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(185,255,79,.025) 1px,transparent 1px);background-size:auto,32px 32px,32px 32px}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.035;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 140 140' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
    .shell{width:min(1440px,calc(100% - 36px));margin:0 auto;padding:34px 0 72px}.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:42px}.eyebrow{font:700 12px/1 "Cascadia Code",monospace;letter-spacing:.22em;color:var(--acid);text-transform:uppercase}.brand h1{font-size:clamp(38px,6vw,76px);letter-spacing:-.055em;line-height:.9;margin:13px 0 0;font-weight:800}.brand h1 span{display:block;color:var(--muted);font-weight:300}.status{min-width:280px;border:1px solid var(--line);background:rgba(16,25,23,.82);backdrop-filter:blur(18px);padding:15px 17px;box-shadow:var(--shadow)}.status-row{display:flex;gap:11px;align-items:center}.lamp{width:9px;height:9px;border-radius:50%;background:var(--amber);box-shadow:0 0 18px currentColor}.lamp.ready{background:var(--acid)}.lamp.bad{background:var(--red)}.status strong{font:700 12px "Cascadia Code",monospace;text-transform:uppercase;letter-spacing:.08em}.status small{display:block;color:var(--muted);margin:8px 0 0 20px}
    .grid{display:grid;grid-template-columns:minmax(300px,.8fr) minmax(420px,1.6fr);gap:20px;align-items:start}.panel{border:1px solid var(--line);background:linear-gradient(145deg,rgba(18,29,26,.96),rgba(12,19,18,.96));box-shadow:var(--shadow)}.panel-head{display:flex;align-items:center;justify-content:space-between;padding:17px 20px;border-bottom:1px solid var(--line)}.panel-head h2{margin:0;font-size:14px;text-transform:uppercase;letter-spacing:.1em}.counter{font:12px "Cascadia Code",monospace;color:var(--muted)}.panel-body{padding:20px}.stack{display:grid;gap:20px}
    .drop{position:relative;border:1px dashed #45574f;min-height:142px;display:grid;place-items:center;text-align:center;padding:22px;transition:.2s;background:rgba(0,0,0,.12)}.drop:hover,.drop:focus-within{border-color:var(--acid);background:rgba(185,255,79,.035)}.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}.drop b{display:block;margin-bottom:6px}.drop span{font:12px "Cascadia Code",monospace;color:var(--muted)}
    .files{display:grid;gap:8px;max-height:330px;overflow:auto;padding-right:4px}.file{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center;padding:11px;border:1px solid transparent;background:#0b1311;cursor:pointer}.file:hover{border-color:#3a4a44}.file input{accent-color:var(--acid)}.file-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}.size{font:11px "Cascadia Code",monospace;color:var(--muted)}
    button{border:0;font:700 12px "Cascadia Code",monospace;text-transform:uppercase;letter-spacing:.07em;cursor:pointer;transition:transform .15s,filter .15s;background:var(--acid);color:#0a100d;padding:13px 16px}button:hover{filter:brightness(1.08);transform:translateY(-1px)}button:disabled{opacity:.35;cursor:not-allowed;transform:none}.secondary{background:transparent;color:var(--ink);border:1px solid var(--line);padding:8px 10px}.danger{color:var(--red)}.actions{display:flex;gap:9px;margin-top:14px}.actions button:first-child{flex:1}
    .summary{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border-bottom:1px solid var(--line)}.metric{background:var(--panel);padding:14px 17px}.metric b{display:block;font:600 21px "Cascadia Code",monospace}.metric span{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
    .jobs{display:grid}.job{padding:19px 20px;border-bottom:1px solid var(--line)}.job:last-child{border-bottom:0}.job-top{display:flex;justify-content:space-between;gap:16px}.job-name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.badge{font:10px "Cascadia Code",monospace;text-transform:uppercase;padding:5px 7px;border:1px solid var(--line);color:var(--muted)}.badge.running{color:var(--amber);border-color:rgba(255,181,71,.4)}.badge.succeeded{color:var(--acid);border-color:rgba(185,255,79,.4)}.badge.failed{color:var(--red);border-color:rgba(255,107,95,.4)}.progress-meta{display:flex;justify-content:space-between;margin-top:14px;font:11px "Cascadia Code",monospace;color:var(--muted)}.track{height:5px;background:#070c0b;margin-top:8px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--acid));transition:width .5s}.job-actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}.job-actions a{font:10px "Cascadia Code",monospace;color:var(--ink);text-decoration:none;border:1px solid var(--line);padding:7px 9px;text-transform:uppercase}.error{color:var(--red);font-size:12px;margin-top:10px}.empty{padding:44px 20px;color:var(--muted);text-align:center;font:12px "Cascadia Code",monospace}.toast{position:fixed;right:24px;bottom:24px;max-width:360px;padding:14px 17px;background:var(--ink);color:var(--dark);font-size:13px;box-shadow:var(--shadow);transform:translateY(140%);transition:.25s;z-index:4}.toast.show{transform:none}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:900px){.grid{grid-template-columns:1fr}.topbar{display:grid}.status{min-width:0}.summary{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.shell{width:min(100% - 22px,1440px);padding-top:22px}.brand h1{font-size:42px}.panel-body{padding:14px}.job{padding:16px 14px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
<main class="shell">
  <header class="topbar">
    <div class="brand"><div class="eyebrow">Brave / Speech Systems / 01</div><h1>TRANSKRYPCJA<span>CONTROL DECK</span></h1></div>
    <div class="status" aria-live="polite"><div class="status-row"><i id="statusLamp" class="lamp"></i><strong id="statusTitle">Sprawdzanie systemu</strong></div><small id="statusDetail">Łączenie z modelem i GPU…</small></div>
  </header>

  <div class="grid">
    <div class="stack">
      <section class="panel"><div class="panel-head"><h2>01 / Inbox</h2><span id="inboxCount" class="counter">0 plików</span></div><div class="panel-body"><div id="inboxList" class="files"><div class="empty">Skanowanie data/inbox…</div></div><div class="actions"><button id="batchButton" disabled>Uruchom wybrane</button><button id="refreshInbox" class="secondary" type="button">Odśwież</button></div></div></section>
      <section class="panel"><div class="panel-head"><h2>02 / Upload</h2><span class="counter">limit 3 GB</span></div><div class="panel-body"><label class="drop"><input id="uploadInput" type="file" accept="video/mp4,.mp4" multiple><span><b>Upuść MP4 lub wybierz z dysku</b>Duże wsady szybciej obsłuży folder inbox.</span></label><div class="actions"><button id="uploadButton" disabled>Wyślij pliki</button></div></div></section>
    </div>

    <section class="panel"><div class="panel-head"><h2>03 / Kolejka</h2><span id="queueETA" class="counter">ETA —</span></div><div class="summary"><div class="metric"><b id="runningCount">0</b><span>W toku</span></div><div class="metric"><b id="queuedCount">0</b><span>Oczekuje</span></div><div class="metric"><b id="doneCount">0</b><span>Gotowe</span></div><div class="metric"><b id="workerCount">1</b><span>Workery</span></div></div><div id="jobsList" class="jobs"><div class="empty">Brak zadań. Dodaj pierwszy film.</div></div></section>
  </div>
</main>
<div id="toast" class="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s);let inbox=[],uploads=[];
const esc=s=>String(s??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));
const size=n=>n>1e9?(n/1e9).toFixed(2)+" GB":n>1e6?(n/1e6).toFixed(1)+" MB":Math.ceil(n/1e3)+" KB";
const duration=s=>{if(s==null||!isFinite(s)||s<=0)return"—";const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=Math.floor(s%60);return(h?h+"h ":"")+(m?m+"m ":"")+x+"s"};
function toast(message){const el=$("#toast");el.textContent=message;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),3500)}
async function api(url,options){const response=await fetch(url,options);const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error?.message||`Błąd HTTP ${response.status}`);return data}
async function loadReady(){try{const data=await fetch("/readyz").then(async r=>({ok:r.ok,data:await r.json()}));$("#statusLamp").className="lamp "+(data.ok?"ready":"bad");$("#statusTitle").textContent=data.ok?"System gotowy":"System wymaga uwagi";$("#statusDetail").textContent=data.ok?`${data.data.gpu?.name||"GPU"} · ${data.data.model||"model"} · ${data.data.workers||1} worker`:data.data.message||"Sprawdź konfigurację kontenera"}catch{$("#statusLamp").className="lamp bad";$("#statusTitle").textContent="Brak połączenia";$("#statusDetail").textContent="Serwis nie odpowiada"}}
async function loadInbox(){try{const data=await fetch("/api/v1/inbox?limit=100").then(r=>r.json());inbox=data.items||[];$("#inboxCount").textContent=`${inbox.length} plików`;$("#inboxList").innerHTML=inbox.length?inbox.map((f,i)=>`<label class="file"><input type="checkbox" data-inbox="${i}"><span class="file-name">${esc(f.name)}</span><span class="size">${size(f.sizeBytes)}</span></label>`).join(""):`<div class="empty">Folder inbox jest pusty.</div>`;updateBatch()}catch(e){toast(e.message)}}
function updateBatch(){$("#batchButton").disabled=!document.querySelector("[data-inbox]:checked")}
$("#inboxList").addEventListener("change",updateBatch);$("#refreshInbox").addEventListener("click",loadInbox);
$("#batchButton").addEventListener("click",async()=>{const files=[...document.querySelectorAll("[data-inbox]:checked")].map(x=>inbox[+x.dataset.inbox].name);try{await api("/api/v1/batches",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({files})});toast(`Dodano ${files.length} zadań`);loadJobs()}catch(e){toast(e.message)}});
$("#uploadInput").addEventListener("change",e=>{uploads=[...e.target.files];$("#uploadButton").disabled=!uploads.length;$("#uploadButton").textContent=uploads.length?`Wyślij (${uploads.length})`:"Wyślij pliki"});
$("#uploadButton").addEventListener("click",async()=>{const button=$("#uploadButton");button.disabled=true;for(const file of uploads){const form=new FormData();form.append("file",file);button.textContent=`Wysyłanie: ${file.name}`;try{await api("/api/v1/transcriptions",{method:"POST",body:form})}catch(e){toast(`${file.name}: ${e.message}`)}}uploads=[];$("#uploadInput").value="";button.textContent="Wyślij pliki";loadJobs()});
const statusLabel={queued:"oczekuje",running:"przetwarzanie",succeeded:"gotowe",failed:"błąd",canceled:"anulowano"};
function renderJob(j){const p=j.progress||{},links=j.artifacts||{},canCancel=["queued","running"].includes(j.status);return `<article class="job"><div class="job-top"><div class="job-name" title="${esc(j.source?.fileName)}">${esc(j.source?.fileName||j.id)}</div><span class="badge ${j.status}">${statusLabel[j.status]||j.status}</span></div><div class="progress-meta"><span>${esc(p.stage||"queued")} · ${p.percent||0}%${p.realtimeFactor?` · ${p.realtimeFactor.toFixed(2)}×`:""}</span><span>ETA ${duration(p.etaSeconds)}</span></div><div class="track"><div class="fill" style="width:${Math.max(0,Math.min(100,p.percent||0))}%"></div></div>${j.error?`<div class="error">${esc(j.error.message)}</div>`:""}<div class="job-actions">${canCancel?`<button class="secondary danger" data-cancel="${j.id}">Anuluj</button>`:""}${links.txt?`<a href="${links.txt}">TXT</a>`:""}</div></article>`}
async function loadJobs(){try{const data=await fetch("/api/v1/transcriptions?limit=100").then(r=>r.json()),jobs=data.items||[],s=data.summary||{};$("#jobsList").innerHTML=jobs.length?jobs.map(renderJob).join(""):`<div class="empty">Brak zadań. Dodaj pierwszy film.</div>`;$("#runningCount").textContent=s.running||0;$("#queuedCount").textContent=s.queued||0;$("#doneCount").textContent=s.succeeded||0;$("#workerCount").textContent=s.workers||1;$("#queueETA").textContent=`ETA ${duration(s.etaSeconds)}`}catch(e){toast(e.message)}}
$("#jobsList").addEventListener("click",async e=>{const id=e.target.dataset.cancel;if(!id)return;try{await api(`/api/v1/transcriptions/${id}/actions/cancel`,{method:"POST"});loadJobs()}catch(err){toast(err.message)}});
loadReady();loadInbox();loadJobs();setInterval(()=>{loadReady();loadJobs()},2000);
</script>
</body>
</html>
