openapi: 3.1.0
info:
  title: Brave STT API
  version: 1.0.0
  description: Asynchroniczna transkrypcja polskich plików MP4 z timestampami segmentów.
  license: {name: Proprietary}
security: []
servers:
  - url: http://{host}:{port}
    variables:
      host: {default: localhost}
      port: {default: "8000"}
paths:
  /healthz:
    get:
      summary: Sprawdź żywotność procesu
      operationId: health
      responses:
        "200": {description: Proces działa}
  /readyz:
    get:
      summary: Sprawdź gotowość modelu i GPU
      operationId: readiness
      responses:
        "200": {description: Serwis gotowy, content: {application/json: {schema: {$ref: "#/components/schemas/Readiness"}}}}
        "503": {description: Serwis nie jest gotowy; odpowiedź zawiera stan wszystkich kontroli, content: {application/json: {schema: {$ref: "#/components/schemas/Readiness"}}}}
  /api/v1/inbox:
    get:
      summary: Wylistuj pliki MP4 z inboxa
      operationId: listInbox
      parameters: [{$ref: "#/components/parameters/Limit"}, {$ref: "#/components/parameters/Cursor"}]
      responses:
        "200":
          description: Strona plików MP4
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/InboxFile"}}
                  nextCursor: {type: string}
  /api/v1/transcriptions:
    post:
      summary: Prześlij MP4 i utwórz zadanie
      operationId: uploadTranscription
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties: {file: {type: string, format: binary}}
      responses:
        "202":
          description: Zadanie przyjęte
          headers: {Location: {schema: {type: string}}}
          content: {application/json: {schema: {$ref: "#/components/schemas/Job"}}}
        "413": {$ref: "#/components/responses/TooLarge"}
        "415": {$ref: "#/components/responses/Unsupported"}
        "503": {$ref: "#/components/responses/Unavailable"}
    get:
      summary: Wylistuj zadania transkrypcji
      operationId: listTranscriptions
      parameters: [{$ref: "#/components/parameters/Limit"}, {$ref: "#/components/parameters/Cursor"}]
      responses:
        "200":
          description: Kolejka transkrypcji
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor, summary]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/Job"}}
                  nextCursor: {type: string}
                  summary: {$ref: "#/components/schemas/QueueSummary"}
  /api/v1/batches:
    post:
      summary: Utwórz wsad z plików inboxa
      operationId: createBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [files]
              properties: {files: {type: array, minItems: 1, maxItems: 20, items: {type: string}}}
      responses:
        "202":
          description: Wsad przyjęty
          content:
            application/json:
              schema:
                type: object
                required: [batchId, jobs]
                properties:
                  batchId: {type: string}
                  jobs: {type: array, items: {$ref: "#/components/schemas/Job"}}
        "422": {$ref: "#/components/responses/Validation"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /api/v1/transcriptions/{id}:
    get:
      summary: Pobierz status zadania
      operationId: getTranscription
      parameters: [{$ref: "#/components/parameters/ID"}]
      responses:
        "200": {description: Status zadania, content: {application/json: {schema: {$ref: "#/components/schemas/Job"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/transcriptions/{id}/actions/cancel:
    post:
      summary: Anuluj zadanie
      operationId: cancelTranscription
      parameters: [{$ref: "#/components/parameters/ID"}]
      responses:
        "200": {description: Zadanie anulowane lub już zakończone, content: {application/json: {schema: {$ref: "#/components/schemas/Job"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/transcriptions/{id}/result:
    get:
      summary: Pobierz wynik JSON
      operationId: getTranscriptionResult
      parameters: [{$ref: "#/components/parameters/ID"}]
      responses:
        "200": {description: Wynik gotowy dla RAG-a, content: {application/json: {schema: {$ref: "#/components/schemas/Transcript"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/NotReady"}
  /api/v1/transcriptions/{id}/artifacts/{format}:
    get:
      summary: Pobierz artefakt transkrypcji
      operationId: downloadArtifact
      parameters:
        - {$ref: "#/components/parameters/ID"}
        - {name: format, in: path, required: true, schema: {type: string, enum: [txt]}}
      responses:
        "200": {description: Plik artefaktu}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/NotReady"}
components:
  parameters:
    ID: {name: id, in: path, required: true, schema: {type: string}}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
    Cursor: {name: cursor, in: query, schema: {type: string}}
  schemas:
    Readiness:
      type: object
      required: [ready]
      properties:
        ready: {type: boolean}
        model: {type: string}
        workers: {type: integer}
        message: {type: string}
        checks: {type: object, additionalProperties: {type: boolean}}
        gpu:
          type: object
          properties: {name: {type: string}, totalMemoryMiB: {type: integer}, usedMemoryMiB: {type: integer}}
    InboxFile:
      type: object
      required: [name, sizeBytes, modifiedAt]
      properties: {name: {type: string}, sizeBytes: {type: integer, format: int64}, modifiedAt: {type: string, format: date-time}}
    Source:
      type: object
      required: [fileName, sizeBytes, durationMs]
      properties: {fileName: {type: string}, sizeBytes: {type: integer, format: int64}, durationMs: {type: integer, format: int64}}
    Progress:
      type: object
      required: [stage, percent]
      properties:
        stage: {type: string, enum: [queued, calibrating, probing, extracting, transcribing, writing, done]}
        percent: {type: integer, minimum: 0, maximum: 100}
        etaSeconds: {type: [integer, "null"]}
        realtimeFactor: {type: [number, "null"]}
    Job:
      type: object
      required: [id, status, progress, source, createdAt]
      properties:
        id: {type: string}
        batchId: {type: string}
        status: {type: string, enum: [queued, running, succeeded, failed, canceled]}
        progress: {$ref: "#/components/schemas/Progress"}
        source: {$ref: "#/components/schemas/Source"}
        createdAt: {type: string, format: date-time}
        startedAt: {type: string, format: date-time}
        finishedAt: {type: string, format: date-time}
        resultUrl: {type: string}
        artifacts: {type: object, additionalProperties: {type: string}}
        error: {$ref: "#/components/schemas/JobError"}
    Segment:
      type: object
      required: [index, startMs, endMs, text]
      properties: {index: {type: integer}, startMs: {type: integer, format: int64}, endMs: {type: integer, format: int64}, text: {type: string}}
    Transcript:
      type: object
      required: [schemaVersion, transcriptionId, source, language, text, segments, engine, processing, createdAt]
      properties:
        schemaVersion: {type: string, const: "1.0"}
        transcriptionId: {type: string}
        source: {$ref: "#/components/schemas/Source"}
        language: {type: string, const: pl}
        text: {type: string}
        segments: {type: array, items: {$ref: "#/components/schemas/Segment"}}
        engine: {type: object, required: [name, version, model], properties: {name: {type: string}, version: {type: string}, model: {type: string}}}
        processing: {type: object, required: [wallTimeMs, realtimeFactor], properties: {wallTimeMs: {type: integer, format: int64}, realtimeFactor: {type: number}}}
        createdAt: {type: string, format: date-time}
    QueueSummary:
      type: object
      properties: {queued: {type: integer}, running: {type: integer}, succeeded: {type: integer}, failed: {type: integer}, canceled: {type: integer}, workers: {type: integer}, etaSeconds: {type: integer}}
    JobError:
      type: object
      required: [code, message]
      properties: {code: {type: string}, message: {type: string}}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties: {code: {type: string}, message: {type: string}, details: {}, requestId: {type: string}}
  responses:
    NotFound: {description: Nie znaleziono zasobu, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    NotReady: {description: Wynik nie jest gotowy, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    Validation: {description: Nieprawidłowe dane wejściowe, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    TooLarge: {description: Plik przekracza 3 GB, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    Unsupported: {description: Nieobsługiwany typ pliku, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    Unavailable: {description: Serwis lub kolejka niedostępna, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
